<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYOAI — preview (v1 neon)</title>
<style>
  :root{
    --violet:#7C3AED; --cyan:#22D3EE; --magenta:#EC4899;
    --bg:#0A0A0F; --panel:#14141C; --panel2:#1C1C28;
    --text:#EDEDFF; --dim:#9A9AB8;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif}
  body{background:radial-gradient(120% 80% at 50% -10%, #1a1030 0%, var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:40px}
  .phone{width:300px;height:640px;background:var(--panel);border-radius:38px;border:1px solid #2a2a3a;box-shadow:0 0 60px rgba(124,58,237,.35),0 30px 80px rgba(0,0,0,.6);overflow:hidden;position:relative}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:5}
  .scr{padding:54px 20px 20px;height:100%;display:flex;flex-direction:column;gap:16px}
  .glow-title{font-size:26px;font-weight:900;letter-spacing:-.5px;text-shadow:0 0 18px var(--violet)}
  .sub{color:var(--dim);font-size:13px}
  .card{background:linear-gradient(160deg,var(--panel2),#16161f);border:1px solid #2c2c40;border-radius:20px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .neon-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.5);color:var(--cyan);font-size:12px;font-weight:700;box-shadow:0 0 14px rgba(34,211,238,.35)}
  .big{font-size:40px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .bar{height:8px;border-radius:8px;background:#26263a;overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px var(--violet)}
  .btn{margin-top:auto;text-align:center;padding:15px;border-radius:16px;font-weight:800;background:linear-gradient(90deg,var(--violet),var(--magenta));box-shadow:0 0 24px rgba(124,58,237,.5)}
  .label{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="scr">
      <div>
        <div class="glow-title">BYOAI</div>
        <div class="sub">당신의 AI가 이 공간을 읽는 중…</div>
      </div>
      <div class="card">
        <span class="neon-chip">● 연결됨 · 알파룸</span>
        <div class="row"><span class="label">조도</span><span class="big">724</span></div>
        <div class="bar"><i style="width:64%"></i></div>
      </div>
      <div class="card">
        <div class="row"><span class="label">공기질</span><span style="font-weight:800;color:var(--cyan)">좋음</span></div>
        <div class="bar"><i style="width:82%"></i></div>
      </div>
      <div class="card">
        <div class="row"><span class="label">학습된 선호</span><span style="color:var(--magenta);font-weight:800">+3 공간</span></div>
        <div class="sub" style="margin-top:8px">복리 효과 적용 중 — 이전 공간에서 배운 설정을 이어받았습니다.</div>
      </div>
      <div class="btn">AI에게 맡기기</div>
    </div>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="scr">
      <div>
        <div class="glow-title">My AI</div>
        <div class="sub">포터블 선호 모델</div>
      </div>
      <div class="card">
        <div class="label">선호 밝기</div>
        <div class="row"><span class="big">아늑</span><span class="neon-chip">학습됨</span></div>
      </div>
      <div class="card">
        <div class="label">선호 온도</div>
        <div class="big" style="font-size:34px">23.5°</div>
      </div>
      <div class="btn" style="background:linear-gradient(90deg,var(--cyan),var(--violet))">다른 공간으로 가져가기</div>
    </div>
  </div>
</body>
</html>
